:root { --u: 0.5px; --dw: 1280; --side: #4a3426; --side2: #5c412f; --line: #2e1f15; --parch: #f4e7c9; --parch2: #e9d6ad; --ink: #3a2616; --dimink: #8a7458; --fire: #e8742a; --leaf: #5aa04a; --red: #d23b2f; }
*, *::before, *::after { box-sizing: border-box; }
html { font-synthesis: none; -webkit-font-synthesis: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--side); height: 100%; }
body {
  margin: 0; position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--side); color: var(--ink);
  font-family: "Iansui", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  font-size: max(14px, calc(28 * var(--u))); line-height: 1.3;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
#app { position: absolute; overflow: hidden; background: var(--side); }
.ab { position: absolute; }
b, strong, th, h1, h2, h3, h4, h5, h6, optgroup { font-weight: normal; }   /* v2-land.12：字型只有 Regular，不要粗體 */
/* 字級（§2.2）*/
.f40 { font-size: max(18px, calc(40 * var(--u))); font-weight: normal; }
.f36 { font-size: max(14px, calc(36 * var(--u))); font-weight: normal; }
.f32 { font-size: max(14px, calc(32 * var(--u))); }
.f30 { font-size: max(14px, calc(30 * var(--u))); font-weight: normal; }
.f28 { font-size: max(14px, calc(28 * var(--u))); }
.f24 { font-size: max(12px, calc(24 * var(--u))); }
.bold { font-weight: normal; }
.t { white-space: nowrap; display: flex; align-items: center; top: 0; height: 100%; }
.ra { transform: translateX(-100%); }
.ca { transform: translateX(-50%); }
.dim { color: var(--dimink); }
.pos { color: #2f7a2a; } .neg { color: var(--red); } .warn { color: #c0561a; }
.hi { color: var(--red); font-weight: normal; }
.male { color: #2a6fb0; } .female { color: #c2456a; }
.tal { color: #a8620e; }
.off { color: #a89a86; }

// ===== 查表 =====
var BLD = {}, JOB = {}, TAL = {};
CONFIG.buildings.forEach(function (b) { BLD[b.id] = b; });
CONFIG.jobs.forEach(function (j) { JOB[j.id] = j; });
HERO_TALENTS.forEach(function (t) { TAL[t[0]] = { id: t[0], cat: t[1], name: t[2], min: t[3], max: t[4], unit: t[5], status: t[6], effect: t[7] }; });
var TAL_BY_CAT = {};
HERO_TALENTS.forEach(function (t) { (TAL_BY_CAT[t[1]] = TAL_BY_CAT[t[1]] || []).push(t[0]); });
function talentActive(tid) { return !!CONFIG.heroTalentEffects[tid]; }

// ===== 亂數（用 start.seed，重新整理結果相同）=====
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ===== 生成（純函式：同一個 seed → 同一份結果）=====
function genWorld(seed) {
  var C = CONFIG, rnd = mulberry32(seed >>> 0);
  function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  var P = ri(C.popMin, C.popMax);
  var H = Math.round(C.heroRatio * P + 1e-9);
  var R = P - H, people = [], i;
  for (i = 0; i < R; i++) people.push(genResident(i + 1));
  // §7 居民生產天賦：每局配額
  var r = C.resTalentRMin + (C.resTalentRMax - C.resTalentRMin) * rnd();
  var n = Math.round(R * r), idx = [];
  for (i = 0; i < R; i++) idx.push(i);
  for (i = 0; i < n; i++) {
    var j = i + Math.floor(rnd() * (R - i)), tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    var u = rnd(), acc = 0, pick = C.resTalentJobs[C.resTalentJobs.length - 1];
    for (var q = 0; q < C.resTalentJobs.length; q++) { acc += C.resTalentJobs[q].p; if (u < acc) { pick = C.resTalentJobs[q]; break; } }
    people[idx[i]].talent = { kind: 'res', job: pick.job, name: pick.name, coef: pick.coef };
  }
  for (i = 0; i < H; i++) people.push(genHero(R + i + 1));
  var lord = { sex: null, points: C.lordSysPoints + C.lordFreePoints, sys: rollLordSys(rnd) };   // 性別由玩家選（v1a.3）
  people.forEach(validatePerson);
  return { pop: P, heroes: H, residents: R, r: r, people: people, lord: lord };

  function base(id, type) {
    return { id: id, type: type, sex: rnd() < C.maleRatio ? 'M' : 'F', age: ri(C.ageMin, C.ageMax), loyalty: C.loyalty, cur: [], cap: [], talent: null };
  }
  function genResident(id) {
    var p = base(id, 'res');
    for (var a = 0; a < 5; a++) {
      var cap = rnd() < C.resCap3P ? 3 : 2;
      var cur = cap === 2 ? (rnd() < C.resCap2Cur1P ? 1 : 2) : (rnd() < C.resCap3Cur3P ? 3 : 2);
      p.cap.push(cap); p.cur.push(cur);
    }
    return p;
  }
  function genHero(id) {
    var p = base(id, 'hero'), u = rnd(), k = C.heroKProbs.length, acc = 0, a;
    for (a = 0; a < C.heroKProbs.length; a++) { acc += C.heroKProbs[a]; if (u < acc) { k = a + 1; break; } }
    var order = [0, 1, 2, 3, 4];
    for (a = 0; a < 5; a++) { var j = a + Math.floor(rnd() * (5 - a)), t = order[a]; order[a] = order[j]; order[j] = t; }
    var stand = order.slice(0, k), cur = [0, 0, 0, 0, 0];
    stand.forEach(function (s) { cur[s] = rnd() < C.heroStandout5P ? 5 : 4; });
    var guard = 0;
    do {
      for (a = 0; a < 5; a++) if (stand.indexOf(a) < 0) cur[a] = rnd() < C.heroOther3P ? 3 : 2;
      if (++guard > 1000) throw new Error('英雄生成重抽超過 1000 次');
    } while (cur[0] + cur[1] + cur[2] + cur[3] + cur[4] < C.heroMinTotal);
    p.cur = cur.slice(); p.cap = cur.slice();       // 英雄 cap = cur【預設 §16 #9】
    p.standout = stand.slice().sort();
    if (rnd() < C.heroTalentP) {
      var cat = ATTR[stand[Math.floor(rnd() * stand.length)]];
      var pool = TAL_BY_CAT[cat], tid = pool[Math.floor(rnd() * pool.length)], T = TAL[tid];
      p.talent = { kind: 'hero', tid: tid, value: T.min + (T.max - T.min) * rnd() };   // 建立時抽一次【預設 §16 #8】
    }
    return p;
  }
}
function rollLordSys(rnd) {   // 系統點：每點 1/5 機率落在某一項；那項已滿 5★ 就重抽（10 點 < 25 格，一定抽得完）
  var sys = [0, 0, 0, 0, 0];
  for (var i = 0; i < CONFIG.lordSysPoints; i++) {
    var a; do { a = Math.floor(rnd() * 5); } while (sys[a] >= CONFIG.lordAttrMax);
    sys[a]++;

}
function validatePerson(p) {
  for (var a = 0; a < 5; a++) {
    var c = p.cur[a], k = p.cap[a];
    if (!(c === (c | 0) && k === (k | 0) && c >= 1 && c <= k && k <= 5)) throw new Error('人物資料錯誤：#' + p.id + ' ' + ATTR[a] + ' cur=' + c + ' cap=' + k + '（要 1 <= cur <= cap <= 5）');

// ===== 狀態 =====
var state, MODS;
function startMaterial(P) {   // v2-land.21 §1 #4；−1e-9：P = 35 時 0.2 × 35 ÷ 1.75 在浮點是 4.000…01
  var C = CONFIG, n0 = Math.ceil(C.startMatHouses * P / C.startMatPerHouse - 1e-9), m = C.startMatBase;
  for (var n = 1; n <= n0; n++) m += Math.round(C.startMatFirst * Math.pow(C.costGrowth, n - 1));
  return m;
}
function newGameState(seed) {
  var w = genWorld(seed), C = CONFIG;
  var s = {
    v: C.saveVersion,
    start: { pop: w.pop, seed: seed >>> 0 },
    lord: { sex: null, points: w.lord.points, sys: w.lord.sys.slice(), attrs: w.lord.sys.slice(), done: false },   // attrs = 系統 + 自由
    people: w.people.map(function (p) { p.job = null; p.bld = -1; p.seq = 0; p.reenlistLockUntil = 0; return p; }),
    food: C.startFoodPerPop * w.pop, material: startMaterial(w.pop), mineral: 0,
    built: {}, happiness: 0, seqCounter: 0, enlistQ: [], enlistLeft: 0, stray: { at: 0, cdUntil: 0 },   // v2-land.22：stray.at = 流浪者到達時間（0 = 沒有在路上），cdUntil = 冷卻結束（毫秒，真實時間）   // v2-land.21：enlistQ = [{ id, food }]，排第一的在訓練，enlistLeft = 剩幾秒
    explored: [], lastOnline: Date.now(), playSec: 0,
    goalIndex: 0, lastSeen: Date.now()   // 橫式 v2：目標進度、最後在線時間（只給畫面用）
  };
  C.buildings.forEach(function (b) { s.built[b.id] = b.start || 0; });
  for (var i = 0; i < C.map.cols * C.map.rows; i++) s.explored.push(1);   // 全部已探索，沒有迷霧（保留欄位給之後）
  var m = heroMods(s.people);
  s.happiness = Math.round(C.happinessStart + m.inspire);
  return s;
}

// 英雄天賦加總（英雄固定，所以載入後算一次）
function heroMods(people) {
  var m = { prod: {}, slot: {}, jerky: 0, supply: 0, carry: 0, leader: 0, costAll: [], costBld: {}, straw: 0, resolve: 0, inspire: 0, list: [] };
  CONFIG.jobs.forEach(function (j) { m.prod[j.id] = 0; });
  people.forEach(function (p) {
    if (p.type !== 'hero' || !p.talent) return;
    var e = CONFIG.heroTalentEffects[p.talent.tid], v = p.talent.value;
    if (!e) return;
    m.list.push(p.talent.tid);
    if (e.type === 'prod') e.jobs.forEach(function (j) { m.prod[j] += v / 100; });
    else if (e.type === 'slot') m.slot[e.bld] = (m.slot[e.bld] || 0) + Math.round(v);
    else if (e.type === 'jerky') m.jerky += v / 100;
    else if (e.type === 'supply') m.supply += v / 100;
    else if (e.type === 'leader') m.leader += v / 100;
    else if (e.type === 'cost') { if (e.blds) e.blds.forEach(function (b) { (m.costBld[b] = m.costBld[b] || []).push(v / 100); }); else m.costAll.push(v / 100); }
    else if (e.type === 'straw') m.straw += v;
    else if (e.type === 'resolve') m.resolve += v / 100;
    else if (e.type === 'inspire') m.inspire += v;
    else if (e.type === 'carry') m.carry += v / 100;
  });
  return m;
}

function slotsPer(bid) { return (BLD[bid].slots || 0) + (MODS.slot[bid] || 0); }
function jobSlots(jid) { var b = JOB[jid].bld; return state.built[b] * slotsPer(b); }
function costOf(bid) {
  var c = BLD[bid].cost * CONFIG.costMult * Math.pow(CONFIG.costGrowth, state.built[bid]);   // v2-land.21 §1 #1：第 n 座（n = 已蓋 + 1）
  MODS.costAll.concat(MODS.costBld[bid] || []).forEach(function (r) { c *= Math.max(0, 1 - r); });
  return Math.round(c);
}
function beds() { return state.built.house * BLD.house.beds; }
function popCap() { return state.start.pop + beds(); }   // v2-land.22 §1 #15：開局人口 + 每座住所 2 床（開局的人不用床）
function jobS(p, jid) { var w = JOB[jid].w, s = 0; for (var a = 0; a < 5; a++) s += w[a] * p.cur[a]; return s; }
function resTalentPct(p) {   // 居民天賦數值（%）：係數 × max(3, 3s − 1)，s = 天賦職業的加權
  if (!p.talent || p.talent.kind !== 'res') return 0;
  var s = jobS(p, p.talent.job);
  return p.talent.coef * Math.max(CONFIG.resTalentMinPct, CONFIG.resTalentPerStar * s + CONFIG.resTalentOffset);
}
function hasJobTalent(p, jid) { return !!(p.talent && p.talent.kind === 'res' && p.talent.job === jid); }
function isIdleRes(p) { return p.type === 'res' && !p.job && !p.inQ; }   // inQ：入伍佇列中（排隊或訓練），不工作、不撿柴
function stamTerm(p) { return CONFIG.staminaPerStar * (p.cur[A_STAMINA] - CONFIG.staminaBase); }
function spiritR(p) { return CONFIG.spiritPerStar * (p.cur[A_SPIRIT] - CONFIG.spiritBase); }

// ===== 產量／消耗（§9.3、§10.1）。people 可以是假設的派工（「還能閒置」試算用），virtual = 不受座數限制 =====
function computeEcon(people) {
  var C = CONFIG, e = { job: {}, workers: {}, food: 0, material: 0, mineral: 0, cons: 0, gather: 0, straw: 0, leaders: {}, soldiers: 0, soldierCons: 0, maxM: 0 };
  var groups = {};
  people.forEach(function (p) {
    if (p.job === 'soldier') { e.soldiers++; return; }
    if (!p.job) return;
    var key = p.job + ':' + p.bld;
    (groups[key] = groups[key] || []).push(p);
  });
  C.jobs.forEach(function (j) { e.job[j.id] = 0; e.workers[j.id] = 0; });
  Object.keys(groups).forEach(function (key) {
    var list = groups[key], jid = list[0].job, J = JOB[jid], B = BLD[J.bld];
    var leader = list[0];   // 領班：統帥 s 最高；同分選最早進這座建築的人（seq 小）
    list.forEach(function (p) { if (p.cur[A_COMMAND] > leader.cur[A_COMMAND] || (p.cur[A_COMMAND] === leader.cur[A_COMMAND] && p.seq < leader.seq)) leader = p; });
    e.leaders[key] = leader.id;
    var lead = C.leaderPerStar * Math.max(0, leader.cur[A_COMMAND] - C.leaderBase) * (1 + MODS.leader);
    var tribe = 1 + MODS.prod[jid];
    list.forEach(function (p) {
      var m = 1 + (J.stamina ? stamTerm(p) : 0) + (hasJobTalent(p, jid) ? resTalentPct(p) / 100 : 0) + lead;
      m = Math.min(C.personalMultCap, m);
      if (m > e.maxM) e.maxM = m;
      var out = B.rate * tribe * m * C.happinessProdE;
      e.job[jid] += out; e.workers[jid]++;
      e[B.produces] += out;

    if (p.job === 'soldier') { c *= C.soldierFoodMult * (1 - lordBonus(A_COMMAND)); e.soldierCons += c; }   // §1 #12：0.24 × (1 − 領主統帥加成) × (1 − 補給%)
    else if (p.type === 'hero') c *= C.heroFoodMult;
    if (p.job === 'hunt') c *= jerky;

  });

  return e;
}

var econCache = null;
function econ() { if (!econCache) econCache = computeEcon(state.people); return econCache; }
function dirty() { econCache = null; hintCache = null; uiDirty = true; }

function happinessDecayPerMin() {
  var n = state.people.length, R = 0;
  state.people.forEach(function (p) { R += spiritR(p); });
  R = n ? R / n : 0;
  return CONFIG.happinessDecayPerMin * (1 - R) * Math.max(0, 1 - MODS.resolve);
}

// ===== v2-land.21：倉庫上限、入伍佇列、離線收益 =====
function lordBonus(a) { var C = CONFIG; return Math.min(C.lordBonusMax, (a === A_VALOR ? C.lordValorEnlistPerStar : C.lordCommandFoodPerStar) * ((state.lord.attrs && state.lord.attrs[a]) || 0)); }

  var c = CONFIG.storageBase;
  for (var n = 1; n <= (state.built.storage || 0); n++) c += CONFIG.storagePer * Math.pow(CONFIG.costGrowth, n - 1);

}

  var v = state[k], nv = Math.max(0, v + d), lost = 0;

}

}
function strayTick(now) {   // 到了就 +1 人，冷卻從到達那一刻（at）開始

  var id = 0; state.people.forEach(function (p) { id = Math.max(id, p.id); });
  var p = genStrayResident(id + 1, mulberry32((state.start.seed ^ Math.imul(id + 1, 0x9E3779B9)) >>> 0));

}
function genStrayResident(id, rnd) {   // 屬性機率和開局居民一樣（genWorld 的 genResident），沒有天賦
  var C = CONFIG, p = { id: id, type: 'res', sex: rnd() < C.maleRatio ? 'M' : 'F', age: C.ageMin + Math.floor(rnd() * (C.ageMax - C.ageMin + 1)), loyalty: C.loyalty, cur: [], cap: [], talent: null };

function enlistSecs() { return CONFIG.enlistSec * (1 - lordBonus(A_VALOR)); }
function advanceQueue(sec) {   // 只動排第一的；時間用完就成為士兵，下一位接著從頭算（多出來的秒數接著用）

        h += L(52, attrHTML(p, 0, 24) + attrHTML(p, 1, 248) + attrHTML(p, 2, 472));
        h += L(52, attrHTML(p, 3, 24) + attrHTML(p, 4, 248));
        if (p.talent) {
          var J = JOB[p.talent.job], pct = fmtNum(resTalentPct(p), 1);
          h += L(56, S(24, p.talent.name + ' ' + (p.job === p.talent.job ? '+' + pct + '%' : '0%（' + J.name + '時 +' + pct + '%）'), 'tal'));
        }
      }
      h += '</div>';
    });
    if (!rows.length) h = L(64, S(24, '沒有符合條件的居民', 'dim')) + L(112, '<button class="btn ab f28" id="btnClearFilter" style="left:' + du(24) + ';top:' + du(8) + ';width:' + du(240) + ';height:' + du(96) + '"><span>清除篩選</span></button>');
    list.innerHTML = h;
  }
  return upd;
}

// ===== 軍營 =====
function buildBarracks(b) {
  var h1 = line(b, 72); var head = txt(h1, 24, '', 'bold'); head.id = 'soldierHead';
  txt(line(b, 64, 'hd'), 24, '訓練中');   // v2-land.21 §2：入伍佇列
  var qu = el('div', '', b); qu.id = 'enlistQueue';
  txt(line(b, 64, 'hd'), 24, '入伍（閒置、勇武 ' + CONFIG.enlistMinValor + '★ 以上，' + CONFIG.enlistFood + ' 食物）');
  var en = el('div', '', b); en.id = 'enlistList';
  txt(line(b, 64, 'hd'), 24, '士兵');
  var so = el('div', '', b); so.id = 'soldierList';
  var nt = el('div', 'wrap dim f24', b, '入伍按下時扣 ' + CONFIG.enlistFood + ' 食物，訓練 ' + fmtNum(enlistSecs(), 1) + ' 秒；一次訓練 1 人，最多排 ' + CONFIG.enlistQueueMax + ' 人，取消全退。士兵只駐守，不工作。轉回後 ' + Math.round(CONFIG.reenlistLockSec / 60) + ' 分鐘內不能再入伍。'); nt.style.padding = du(24);
  b.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t || t.disabled) return;
    var id = +t.getAttribute('data-id');
    var act = t.getAttribute('data-act');
    if (act === 'enlist') enlist(id); else if (act === 'back') discharge(id); else if (act === 'cancel') cancelEnlist(id);
    lastBk = ''; render(true);
  });
  var lastBk = '';
  function S(x, s, cls) { return '<span class="ab t' + (cls ? ' ' + cls : '') + '" style="left:' + du(x) + '">' + s + '</span>'; }
  function B(act, id, label, w) { return '<button class="btn ab f28" data-act="' + act + '" data-id="' + id + '" id="' + act + '-' + id + '" style="left:' + du(712 - w) + ';top:' + du(4) + ';width:' + du(w) + ';height:' + du(96) + '"><span>' + label + '</span></button>'; }
  return function () {
    var e = econ(), now = Date.now();
    setText(head, '士兵 ' + e.soldiers + ' / ' + CONFIG.barracksCapL1 + ' 人，每秒吃 ' + fmtNum(e.soldierCons, 2) + ' 食物');
    var blk = enlistBlock(), paused = state.enlistQ.length && queuePaused(e);
    var cand = state.people.filter(function (p) { return enlistState(p, now); });
    var sol = state.people.filter(function (p) { return p.job === 'soldier'; });
    var key = blk + '|' + paused + '|' + state.enlistQ.map(function (it) { return it.id; }).join() + '|' + Math.ceil(state.enlistLeft) + '|' + cand.map(function (p) { var st = enlistState(p, now); return p.id + st + (st === 'locked' ? fmtClock((p.reenlistLockUntil - now) / 1000) : ''); }).join() + '|' + sol.map(function (p) { return p.id; }).join();
    if (key === lastBk) return;
    lastBk = key;
    var h = '';
    state.enlistQ.forEach(function (it, i) {
      var p = byId(it.id); if (!p) return;
      h += '<div class="ln sep" style="height:' + du(104) + '" data-q="' + p.id + '">' + S(24, '#' + pad2(p.id) + ' ' + sexCh(p) + ' ' + p.age + '歲') +
        S(300, i ? '排隊中' : paused ? '暫停（食物 0）' : '訓練中 ' + fmtClock(state.enlistLeft), i || paused ? 'dim' : '') + B('cancel', p.id, '取消', 160) + '</div>';
    });
    if (!state.enlistQ.length) h = '<div class="ln" style="height:' + du(64) + '">' + S(24, '沒有人在訓練', 'dim') + '</div>';
    $('enlistQueue').innerHTML = h;
    h = '';
    var why = { cap: '士兵已滿 ' + CONFIG.barracksCapL1 + ' 人', queue: '佇列已滿 ' + CONFIG.enlistQueueMax + ' 人', food: '食物不夠 ' + CONFIG.enlistFood }[blk];
    cand.forEach(function (p) {
      var st = enlistState(p, now);
      h += '<div class="ln sep' + (st === 'locked' ? ' dim' : '') + '" style="height:' + du(104) + '" data-row="' + p.id + '">' + S(24, '#' + pad2(p.id) + ' ' + sexCh(p) + ' ' + p.age + '歲') +
        S(220, '勇 ' + starsHTML(p.cur[0], p.cap[0], 5)) +
        (st === 'locked' ? S(696, fmtClock((p.reenlistLockUntil - now) / 1000), 'ra lock') : why ? S(696, why, 'ra dim') : B('enlist', p.id, '入伍', 200)) + '</div>';
    });
    if (!cand.length) h = '<div class="ln" style="height:' + du(64) + '">' + S(24, '目前沒有可入伍的人', 'dim') + '</div>';
    $('enlistList').innerHTML = h;
    h = '';
    sol.forEach(function (p) {
      h += '<div class="ln sep" style="height:' + du(104) + '">' + S(24, '#' + pad2(p.id) + ' ' + sexCh(p) + ' ' + p.age + '歲') + B('back', p.id, '轉回居民', 240) + '</div>';
    });
    if (!sol.length) h = '<div class="ln" style="height:' + du(64) + '">' + S(24, '目前沒有士兵', 'dim') + '</div>';
    $('soldierList').innerHTML = h;
  };
}

// ===== 領主分配（新遊戲第一個畫面；全畫面，左半：性別與說明，右半：點數）=====
function buildLordSetup() {
  var o = $('lordSetup'); o.innerHTML = '';
  box(o, 0, 0, 'var(--dw)', 720);
  var half = el('div', 'ab half', o); box(half, 0, 0, 'var(--dw) / 2', 720);
  var t = el('div', 'ab t f40', o, '分配領主屬性'); box(t, 48, 16, null, 80);
  var av = el('div', 'ab avatar N', o, '?'); box(av, 'var(--dw) / 4 - 70', 112, 140, 140); av.id = 'setupAvatar';
  var sm = btn(o, 'var(--dw) / 4 - 176', 280, 160, 96, '♂ 男', 'sexbtn'); sm.id = 'lordSexM'; sm.onclick = function () { lordSetSex('M'); render(true); };
  var sf = btn(o, 'var(--dw) / 4 + 16', 280, 160, 96, '♀ 女', 'sexbtn'); sf.id = 'lordSexF'; sf.onclick = function () { lordSetSex('F'); render(true); };
  var info = el('div', 'ab t', o, '人口 ' + state.people.length + ' 人　選性別、分配 ' + CONFIG.lordFreePoints + ' 點自由點'); box(info, 48, 400, null, 56); info.id = 'setupInfo';
  var note = el('div', 'ab wrap warn f24', o, loadNotice || (importedV1a ? '已讀入 v1a.3 的存檔（只讀，不會改動原本的存檔）。' : '')); box(note, 48, 460, 'var(--dw) / 2 - 96'); note.id = 'loadNotice';
  var TIP = '選好性別、點數用完才能確定，確定後不能再改';
  var tip = el('div', 'ab wrap dim f24', o, TIP); box(tip, 48, 540, 'var(--dw) / 2 - 200'); tip.id = 'lordTip';
  var R0 = 'var(--dw) / 2 + 40';
  var left = el('div', 'ab t f30', o); box(left, R0, 16, null, 80); left.id = 'lordLeft';
  var lg = el('div', 'ab t dim f24', o, '系統＋自由＝合計'); box(lg, 'var(--dw) - 48', 16, null, 80); lg.classList.add('ra'); lg.id = 'lordLegend';
  var rows = ATTR.map(function (n, a) {
    var y = 100 + a * 100;
    var l = el('div', 'ab t bold', o, n); box(l, R0, y, null, 96);
    var mi = btn(o, 'var(--dw) / 2 + 136', y, 96, 96, '－', 'jbtn'); mi.id = 'lord-minus-' + a; mi.onclick = function () { lordAdj(a, -1); render(true); };
    var st = el('span', 'ab', o); box(st, 'var(--dw) / 2 + 248', y + 8); st.style.lineHeight = du(44);
    var v = el('span', 'ab f24', o); box(v, 'var(--dw) / 2 + 248', y + 52); v.style.lineHeight = du(36); v.id = 'lord-val-' + a;
    var pl = btn(o, 'var(--dw) - 144', y, 96, 96, '＋', 'jbtn'); pl.id = 'lord-plus-' + a; pl.onclick = function () { lordAdj(a, 1); render(true); };
    return { mi: mi, pl: pl, st: st, v: v };
  });
  var ok = btn(o, 'var(--dw) / 2 - 120', 608, 240, 96, '確定', 'primary'); ok.id = 'lordOk';
  var tipTimer = 0;
  ok.onclick = function () {   // 不用 disabled：還不能確定時點一下，短暫顯示原因
    if (lordConfirm()) { loadNotice = ''; goHome(); render(true); return; }
    var why = lordBlockReasons(); if (!why.length) return;
    tip.textContent = why.join('、'); tip.className = 'ab wrap warn f24 bold'; tip.setAttribute('data-reason', '1');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { tip.textContent = TIP; tip.className = 'ab wrap dim f24'; tip.removeAttribute('data-reason'); }, 2000);
  };
  R.setup = { left: left, rows: rows, ok: ok, sm: sm, sf: sf, av: av };
}
function lordBlockReasons() {
  var L = state.lord, rest = CONFIG.lordFreePoints - lordUsed(), r = [];
  if (L.sex !== 'M' && L.sex !== 'F') r.push('還沒選性別');
  if (rest > 0) r.push('還有 ' + rest + ' 點沒分');
  return r;
}
function renderLordSetup() {
  var L = state.lord, rest = CONFIG.lordFreePoints - lordUsed();
  setText(R.setup.left, '自由點剩餘 ' + rest + '（共 ' + CONFIG.lordFreePoints + '）');
  R.setup.rows.forEach(function (r, a) {
    setHTML(r.st, starsHTML(L.attrs[a], L.attrs[a], CONFIG.lordAttrMax));
    setText(r.v, L.sys[a] + '+' + (L.attrs[a] - L.sys[a]) + '=' + L.attrs[a]);
    setDis(r.mi, L.attrs[a] <= L.sys[a]); setDis(r.pl, rest <= 0 || L.attrs[a] >= CONFIG.lordAttrMax);
  });
  setCls(R.setup.sm, 'btn ab f28 sexbtn' + (L.sex === 'M' ? ' on' : '')); setCls(R.setup.sf, 'btn ab f28 sexbtn' + (L.sex === 'F' ? ' on' : ''));
  setCls(R.setup.av, 'ab avatar ' + (L.sex === 'M' ? 'M' : L.sex === 'F' ? 'F' : 'N')); setText(R.setup.av, L.sex === 'M' ? '♂' : L.sex === 'F' ? '♀' : '?');
  var blocked = lordBlockReasons().length > 0;
  setCls(R.setup.ok, 'btn ab f28 primary' + (blocked ? ' off' : '')); R.setup.ok.setAttribute('data-blocked', blocked ? '1' : '0');
}

// ===== 請轉橫向（§8）：直式時蓋住全部、暫停模擬 =====
var mqPortrait = window.matchMedia ? window.matchMedia('(orientation: portrait)') : null;
if (mqPortrait) { if (mqPortrait.addEventListener) mqPortrait.addEventListener('change', applyScale); else if (mqPortrait.addListener) mqPortrait.addListener(applyScale); }
function checkOrientation() {
  var p = window.innerHeight > window.innerWidth;   // 和 (orientation: portrait) 相同判斷；直接看尺寸，避免 matchMedia 還沒更新
  if (p === portrait) return;
  portrait = p;
  $('rotate').hidden = !p;
  document.documentElement.setAttribute('data-paused', p ? '1' : '0');
  if (p) { cancelDrag(); cancelHolds(); }
  else {
    last = Date.now();
    if (pendingWelcome !== null && state && state.lord.done) { var a = pendingWelcome; pendingWelcome = null; showWelcome(a); }
  }
}
// ===== 歡迎回來（§7）=====
var lastOffline = null;
function showWelcome(awaySec) {
  if (!state.lord.done) return;
  if (portrait) { pendingWelcome = awaySec; return; }
  openPopup('welcome', awaySec);
}

// ===== 主 render =====
var lastSlow = 0, setupShown = null;
function render(force) {
  var now = Date.now();
  if (uiDirty) { rosterVersion++; }
  var showSetup = !state.lord.done;
  if (showSetup !== setupShown) { setupShown = showSetup; $('lordSetup').hidden = !showSetup; if (showSetup) { closePopup(); closePage(); buildLordSetup(); } }
  if (showSetup) { renderLordSetup(); uiDirty = false; return; }
  renderSides();
  var slow = force || uiDirty || now - lastSlow >= 1000 || now < lastSlow;   // 彈窗、面板數字每 1 秒更新（有操作時立即）
  if (slow) {
    lastSlow = now;
    updateTime();
    if (ui.popup) ui.popup.update();
    if (ui.page) { if (R.popBar) updatePopBar(); if (R.pageUpdate) R.pageUpdate(); }
  }
  setText($('saveNote'), saveFailed ? '這個瀏覽器不允許存檔：遊戲照常進行，但關掉後進度不會保留' : '');
  uiDirty = false;
}

// ===== 迴圈 =====
var lastDraw = 0;
function frameLoop() {
  var t = performance.now();
  if (!inBackground && !portrait && t - lastDraw >= 30) {   // 約 30 fps
    lastDraw = t;
    try { drawMap(); } catch (e) { showError('map', e); }
  }
  if (typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(frameLoop); else setTimeout(frameLoop, 33);
}
function showError(where, e) { $('error').textContent = '程式錯誤（' + where + '）：' + (e && e.message ? e.message : e); if (window.console) console.error(e); }
var last = Date.now(), sinceSave = 0;
// v2-land.12：第一次畫地圖（靜態層＋畫布字）前先等芫荽載好；字型載不到時最多等 FONT_WAIT_MS 就照樣開始（用備用字型），之後載到了再重畫
var FONT_WAIT_MS = 1200, FONT_STATE = { status: 'pending', ms: 0, late: false };
window.TL_FONT = FONT_STATE;   // 測試用
function whenFontReady(cb) {
  var t0 = Date.now(), done = false;
  function go(st) { if (done) return; done = true; FONT_STATE.status = st; FONT_STATE.ms = Date.now() - t0; worldDirty = true; uiDirty = true; cb(); }
  if (!(document.fonts && typeof document.fonts.load === 'function')) { go('none'); return; }
  setTimeout(function () { go('timeout'); }, FONT_WAIT_MS);
  try {
    document.fonts.load('26px "Iansui"', '部落領主').then(function (f) {
      if (done) { FONT_STATE.late = !!(f && f.length); worldDirty = true; uiDirty = true; return; }   // 超時以後才載到：重畫
      go(f && f.length ? 'loaded' : 'missing');
    }, function () { go('error'); });
  } catch (e) { go('error'); }
}
function boot() {
  var fresh = false;
  claimTab();   // v2-land.14：先宣告自己是最新分頁，再讀檔
  try {
    state = loadState();
    if (!state) {
      var m = /[#&?]seed=(\d+)/.exec(location.hash + '&' + location.search);   // 測試用：#seed=N 只在沒有存檔時決定新局的種子
      state = newGameState(m ? (+m[1]) >>> 0 : randomSeed());
      MODS = heroMods(state.people); fresh = true;
    } else MODS = heroMods(state.people);
  } catch (e) { showError('load', e); state = newGameState(randomSeed()); MODS = heroMods(state.people); fresh = true; }
  var away = (Date.now() - state.lastSeen) / 1000;   // 讀檔前的最後在線時間
  if (!fresh) lastOffline = applyOffline(away);   // v2-land.21：離線收益、入伍佇列
  save();
  buildUI();
  applyScale();
  goHome();
  render(true);
  whenFontReady(frameLoop);   // 畫地圖要等字型（DOM 文字用 font-display: block，自己會等）
  if (!fresh && state.lord.done && away >= CONFIG.welcomeMinAwaySec) showWelcome(away);   // 新局不顯示
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { uiDirty = true; worldDirty = true; }, function () {});
}
window.addEventListener('resize', applyScale);
window.addEventListener('orientationchange', function () { applyScale(); setTimeout(applyScale, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', applyScale);
document.addEventListener('visibilitychange', function () {
  if (tabLocked) return;   // v2-land.14：舊分頁不再存、不再顯示歡迎回來
  if (document.visibilityState === 'hidden') { inBackground = true; hiddenAt = Date.now(); cancelDrag(); cancelHolds(); save(); }
  else {
    if (checkTab()) return;
    inBackground = false; last = Date.now(); camDirty = true;
    try { render(true); } catch (e) { showError('render', e); }
    var away = hiddenAt ? (Date.now() - hiddenAt) / 1000 : 0; hiddenAt = 0;
    lastOffline = applyOffline(away); dirty(); save();   // v2-land.21：背景期間照離線算
    if (away >= CONFIG.welcomeMinAwaySec) showWelcome(away);
  }
});
boot();
var lastVW = 0, lastVH = 0;
setInterval(function () {
  if (window.innerWidth !== lastVW || window.innerHeight !== lastVH) { lastVW = window.innerWidth; lastVH = window.innerHeight; try { applyScale(); } catch (e) { showError('scale', e); } }   // 保險：有些瀏覽器轉向後 resize 事件很晚才來
  // v2-land.14：保險，每一輪都讀一次分頁代號（有些情況收不到通知，例如 WebKit 重新載入過的分頁收不到 storage 事件）
  if (!tabLocked && !window.TL_TABPOLL_OFF) checkTab({ via: 'poll' });   // TL_TABPOLL_OFF 只給測試用：單獨驗證通知那條路
  try {
    var now = Date.now(), sec = (now - last) / 1000;
    if (!(sec >= 0)) sec = 0;
    sec = Math.min(sec, CONFIG.maxTickSec);   // 離線、背景都不補時間
    last = now;
    if (inBackground || portrait || tabLocked) sec = 0;   // v2-land.14：舊分頁整個停住     // 請轉橫向時暫停：產出、幸福度、遊玩時間（時鐘）都停
    tick(sec);
    if (state.lord.done) floatTick(sec, econ());
    sinceSave += sec;
    if (sinceSave >= CONFIG.autosaveSec) { sinceSave = 0; save(); }
  } catch (e) { showError('tick', e); }
  try { render(); } catch (e) { showError('render', e); }
}, CONFIG.tickMs);
window.addEventListener('beforeunload', save);
window.addEventListener('pagehide', save);
window.addEventListener('pageshow', function (e) { if (e.persisted) checkTab(); });   // 從上一頁快取回來：先確認
// 測試用（純函式，不改遊戲狀態）
window.TL_SIM = { genWorld: genWorld, CONFIG: CONFIG, HERO_TALENTS: HERO_TALENTS };
window.TL_STATE = function () { return state; };
</script>
